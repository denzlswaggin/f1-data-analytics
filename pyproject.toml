[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-data-analytics"
version = "0.1.0"
description = "End-to-end F1 data engineering platform: ingestion, warehouse, dbt, orchestration, and a teammate-normalized driver-rating insight."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Patrik Kriz" }]
keywords = ["formula1", "data-engineering", "dbt", "dagster", "duckdb"]

dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    # mypy 2.x requires pathspec>=1.0 which conflicts with dbt (<0.13); stay on 1.x.
    # mypy 1.20 imports pathspec APIs unavailable under dbt-core's <0.13 pin.
    "mypy>=1.13,<1.20",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "sqlfluff>=3.2",
    "types-requests>=2.32",
    "types-psycopg2>=2.9",
    "pre-commit>=4.0",
    "pip-tools>=7.4",  # `make lock` -> requirements.lock (pinned core deps)
    "fsspec>=2024.6",  # exercises the object-store lake path (memory:// in tests)
]
# Object-store lake (write the Parquet lake to S3 instead of local disk). Pulls
# fsspec + s3fs; credentials come from the environment (AWS_*). GCS is `gcsfs`.
cloud = [
    "s3fs>=2024.6",
]
# dbt is resolved separately (strict transitive pins) — install with:
#   pip install -e ".[dbt]"
dbt = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "dbt-postgres>=1.9",
]
# FastF1 telemetry ingestion (heavy: pulls matplotlib/scipy). Optional so the
# core install and CI stay lean; the fastf1 client imports it lazily.
telemetry = [
    "fastf1>=3.4",
]
# Dagster orchestration (assets, schedules, dbt integration).
orchestration = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-dbt>=0.25",
]

[project.scripts]
f1-ingest = "ingestion.cli:app"
f1-analytics = "analytics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "analytics", "orchestration"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ingestion", "analytics", "orchestration", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["ingestion", "analytics", "orchestration", "tests"]

# Dagster's decorators and result types don't satisfy strict generics; the
# orchestration layer is validated by `dagster definitions validate` instead.
[[tool.mypy.overrides]]
module = "orchestration.*"
disallow_any_generics = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is reported (term-missing) but not gated — a portfolio repo shouldn't
# fail CI on a coverage threshold. Drop --cov here to silence it locally.
addopts = "-q --cov=ingestion --cov=analytics --cov-report=term-missing"

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "dbt"
max_line_length = 100
