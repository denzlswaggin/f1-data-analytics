# Scheduled Ingest — dry-run / demo workflow.
# This proves the ingestion CLI runs unattended on a schedule. Note that the
# DuckDB warehouse file is ephemeral in CI (it lives only for the job run and
# is discarded afterwards). A real deployment would push to a persistent
# warehouse (e.g. Postgres/managed store) instead of the local DuckDB file.
name: Scheduled Ingest

on:
  schedule:
    # Mondays 06:00 UTC, after race weekends.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  ingest:
    name: Ingest
    runs-on: ubuntu-latest
    env:
      F1_WAREHOUSE: duckdb
      F1_DUCKDB_PATH: data/warehouse/f1.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install -e ".[dbt]"

      - name: Incremental ingest
        run: python -m ingestion.cli incremental

      # Assert the freshly-ingested source isn't stale (event-time freshness on the
      # latest race date). Meaningful here because we just ingested the current
      # season; error_after (120d) tolerates F1's winter off-season, so only a
      # genuinely stalled pipeline fails.
      - name: dbt source freshness
        run: |
          dbt deps --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev
          dbt source freshness --select source:raw.results \
            --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev
