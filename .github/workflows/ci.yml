name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy ingestion analytics tests

      - name: Pytest
        run: pytest -q

  dbt:
    name: dbt
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      F1_DUCKDB_PATH: data/warehouse/f1.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # dbt and the core deps have conflicting transitive pins; resolving them
      # in one pip invocation sends the backtracking resolver into meltdown.
      # Install each extra separately so pip resolves against what's present.
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install -e ".[dbt]"

      # dbt-duckdb opens the warehouse file at parse/compile time and DuckDB
      # will not create missing parent dirs (data/ is gitignored, so absent in CI).
      - name: Prepare warehouse dir
        run: mkdir -p data/warehouse

      # No seed/raw data exists in CI yet, so we validate that the dbt
      # project resolves and compiles rather than running `dbt build`.
      - name: dbt deps
        run: dbt deps --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev

      - name: dbt parse
        run: dbt parse --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev

      - name: dbt compile
        run: dbt compile --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev

  orchestration:
    name: orchestration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Install each extra in its own pip invocation: resolving dev + dbt +
      # orchestration together overflows the backtracking resolver
      # (resolution-too-deep). Separate installs resolve against what's present.
      - name: Install (dev + dbt + orchestration)
        run: |
          pip install -e ".[dev]"
          pip install -e ".[dbt]"
          pip install -e ".[orchestration]"

      # dbt parse opens the DuckDB warehouse file; DuckDB won't create missing
      # parent dirs (data/ is gitignored, so absent in CI).
      - name: Prepare warehouse dir
        run: mkdir -p data/warehouse

      # Generate the dbt manifest the Dagster assets load, then validate the
      # whole asset graph (ingestion -> dbt -> ratings) resolves.
      - name: dbt deps + parse
        run: |
          dbt deps --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev
          dbt parse --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev

      - name: Validate Dagster definitions
        run: dagster definitions validate -m orchestration.definitions
