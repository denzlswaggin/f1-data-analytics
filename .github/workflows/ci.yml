name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install (dev + orchestration test dependencies)
        run: |
          pip install -r requirements-ci.lock
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy ingestion analytics orchestration tests

      - name: Pytest
        run: pytest -q

      - name: Validate Compose stack
        env:
          F1_PG_PASSWORD: ci-only
        run: docker compose config --quiet

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  dashboard-quality:
    name: Dashboard quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            dashboard/package-lock.json
            web/package-lock.json

      - name: Install dashboard validation dependencies
        run: |
          pip install -e "."
          npm --prefix dashboard ci
          npm --prefix web ci

      - name: Prepare compact dashboard snapshot
        run: |
          mkdir -p data/dashboard
          cp tests/fixtures/dashboard-ci.duckdb data/dashboard/latest.duckdb

      - name: Validate Evidence sources and build
        run: |
          python scripts/check_dashboard_snapshot.py data/dashboard/latest.duckdb
          python scripts/check_racecraft_battles.py data/dashboard/latest.duckdb
          npm --prefix dashboard run sources:strict
          npm --prefix dashboard run build:strict
          python scripts/check_dashboard_bundle.py dashboard/build --max-total-mb 275

      - name: Test dependent dashboard filters
        run: node --conditions=browser --test scripts/test_race_event_dropdown.mjs

      - name: Install browser
        run: npm --prefix web exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-preview/f1-data-analytics"
          cp -R dashboard/build/. "$RUNNER_TEMP/dashboard-preview/f1-data-analytics/"
          python -m http.server 4174 --bind 127.0.0.1 --directory "$RUNNER_TEMP/dashboard-preview" \
            >"$RUNNER_TEMP/dashboard-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/test_dashboard_smoke.mjs http://127.0.0.1:4174/f1-data-analytics

  dbt:
    # Build the whole dbt DAG and run the data tests against committed CI seed
    # fixtures (a 2024 Bahrain slice, gated behind `load_ci_seeds`), on BOTH
    # dialects: dev = DuckDB, prod = Postgres. This turns the ~120 declared dbt
    # tests into a real per-PR gate and exercises cross-dialect SQL.
    name: dbt (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    # Postgres warehouse for the `prod` target. It also spins up for the `dev`
    # leg (unused there) — simpler than conditional services, and cheap.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: f1
          POSTGRES_PASSWORD: f1
          POSTGRES_DB: f1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U f1 -d f1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      F1_DUCKDB_PATH: data/warehouse/f1.duckdb
      F1_PG_HOST: localhost
      F1_PG_PORT: "5432"
      F1_PG_USER: f1
      F1_PG_PASSWORD: f1
      F1_PG_DATABASE: f1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # dbt and the core deps have conflicting transitive pins; resolving them
      # in one pip invocation sends the backtracking resolver into meltdown.
      # Install each extra separately so pip resolves against what's present.
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install -e ".[dbt]"

      # dbt-duckdb opens the warehouse file at parse time and DuckDB will not
      # create missing parent dirs (data/ is gitignored, so absent in CI).
      - name: Prepare warehouse dir
        run: mkdir -p data/warehouse

      - name: dbt deps
        run: dbt deps --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target ${{ matrix.target }}

      # Load the CI fixtures into the `raw` schema (gated on load_ci_seeds), then
      # run seeds again + all models, snapshots and data tests via `dbt build`.
      # Seeds have no ref-edge to sources, so seed explicitly first to guarantee
      # the raw.* tables exist before the source-reading models run.
      - name: dbt seed (load CI fixtures)
        run: |
          dbt seed --vars '{load_ci_seeds: true}' \
            --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target ${{ matrix.target }}

      - name: dbt build (models + data tests)
        run: |
          dbt build --vars '{load_ci_seeds: true}' \
            --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target ${{ matrix.target }}

      - name: SQLFluff
        if: matrix.target == 'dev'
        run: sqlfluff lint warehouse/dbt/models --processes 0

      - name: Check incremental telemetry corrections
        if: matrix.target == 'dev'
        run: python scripts/check_telemetry_refresh.py

      # dev leg only: generate the lineage catalog from the built warehouse,
      # enforce docs coverage, and publish the docs site as a downloadable
      # artifact (deliberately NOT GitHub Pages — this repo stays private).
      - name: dbt docs generate
        if: matrix.target == 'dev'
        run: |
          dbt docs generate --vars '{load_ci_seeds: true}' \
            --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev

      - name: Check dbt docs coverage (every model + source described)
        if: matrix.target == 'dev'
        run: python scripts/check_dbt_docs_coverage.py warehouse/dbt/target/manifest.json

      - name: Upload dbt docs (lineage catalog)
        if: matrix.target == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            warehouse/dbt/target/index.html
            warehouse/dbt/target/manifest.json
            warehouse/dbt/target/catalog.json
          if-no-files-found: error

  orchestration:
    name: orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Install each extra in its own pip invocation: resolving dev + dbt +
      # orchestration together overflows the backtracking resolver
      # (resolution-too-deep). Separate installs resolve against what's present.
      - name: Install (dev + dbt + orchestration)
        run: |
          pip install -e ".[dev]"
          pip install -e ".[dbt]"
          pip install -e ".[orchestration]"

      # dbt parse opens the DuckDB warehouse file; DuckDB won't create missing
      # parent dirs (data/ is gitignored, so absent in CI).
      - name: Prepare warehouse dir
        run: mkdir -p data/warehouse

      # Generate the dbt manifest the Dagster assets load, then validate the
      # whole asset graph (ingestion -> dbt -> ratings) resolves.
      - name: dbt deps + parse
        run: |
          dbt deps --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev
          dbt parse --project-dir warehouse/dbt --profiles-dir warehouse/dbt --target dev

      - name: Validate Dagster definitions
        run: dagster definitions validate -m orchestration.definitions
