# Build the Evidence dashboard from a checksum-verified warehouse snapshot and
# publish it to GitHub Pages. The operational pipeline publishes immutable
# snapshots separately; Pages never performs a historical API backfill.
name: Deploy Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Dashboard Snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install snapshot client
        run: pip install -e ".[cloud]"

      - name: Configure snapshot reader credentials
        if: startsWith(vars.F1_DASHBOARD_SNAPSHOT_URI, 's3://')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.F1_SNAPSHOT_READER_ROLE_ARN }}
          aws-region: ${{ vars.F1_AWS_REGION || 'eu-central-1' }}

      - name: Fetch verified dashboard snapshot
        env:
          F1_DASHBOARD_SNAPSHOT_URI: ${{ vars.F1_DASHBOARD_SNAPSHOT_URI }}
        run: |
          test -n "$F1_DASHBOARD_SNAPSHOT_URI"
          python scripts/dashboard_snapshot.py fetch \
            --uri "$F1_DASHBOARD_SNAPSHOT_URI" \
            --output data/dashboard/latest.duckdb

      - name: Check dashboard data
        env:
          F1_DUCKDB_PATH: data/dashboard/latest.duckdb
        run: python scripts/check_dashboard_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Evidence dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run sources:strict
          npm run build:strict

      - name: Enforce dashboard bundle budget
        run: python scripts/check_dashboard_bundle.py dashboard/build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
