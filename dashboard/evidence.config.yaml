appearance:
  default: dark
  switcher: false

# Served from a GitHub Pages project site at /<repo>. All internal links and
# asset URLs are rewritten under this base path at build time.
deployment:
  basePath: /f1-data-analytics

theme:
  colorPalettes:
    default:
      light:
        - "#007f9e"
        - "#7558c9"
        - "#c78d00"
        - "#16825a"
        - "#d7192d"
        - "#cf5b2f"
        - "#3976ca"
        - "#c44a87"
        - "#68758a"
        - "#668a1e"
      dark:
        - "#32d3f4"
        - "#a78bfa"
        - "#f7c948"
        - "#46d39a"
        - "#ff4050"
        - "#ff8c5a"
        - "#6ea8fe"
        - "#f472b6"
        - "#94a3b8"
        - "#c4f169"
  colorScales:
    default:
      light:
        - "#e6f7fa"
        - "#007f9e"
      dark:
        - "#153740"
        - "#32d3f4"
  colors:
    primary:
      light: "#d7192d"
      dark: "#ff4050"
    accent:
      light: "#007f9e"
      dark: "#32d3f4"
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#007f9e"
      dark: "#32d3f4"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # The dashboard reads one immutable DuckDB snapshot. Keep the installed
    # connector set aligned with the only configured source.
    "@evidence-dev/duckdb": {}
