version: 2

sources:
  - name: raw
    description: >
      Raw Ergast/Jolpica-F1 data landed by the ingestion layer, one table per
      resource. Loaded idempotently per season.
    schema: raw
    tables:
      - name: races
        description: Race schedule and circuit metadata, one row per race.
        columns:
          - name: season
            data_tests: [not_null]
          - name: round
            data_tests: [not_null]
      - name: results
        description: Race classification, one row per driver per race.
        # Event-time freshness: results exist only for *completed* races, so the
        # latest race date tracks whether ingestion is keeping up during a season.
        # (raw.races isn't a freshness signal — it carries the full future schedule.)
        # Thresholds tolerate F1's ~4-week summer break; the ~3-month winter
        # off-season is expected downtime — run `dbt source freshness` in-season or
        # right after the persistent Dagster round refresh.
        loaded_at_field: 'cast("date" as timestamp)'
        freshness:
          warn_after: {count: 21, period: day}
          error_after: {count: 120, period: day}
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_id
            data_tests: [not_null]
      - name: qualifying
        description: Qualifying classification, one row per driver per race.
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_id
            data_tests: [not_null]
      - name: laps
        description: FastF1 per-lap timing and tyre data (one row per driver per lap).
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_code
            data_tests: [not_null]
      - name: pitstops
        description: Ergast pit-stop timing (one row per driver per stop).
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_id
            data_tests: [not_null]
      - name: ergast_laps
        description: Ergast per-lap position and time (one row per driver per lap).
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_id
            data_tests: [not_null]
      - name: weather
        description: FastF1 per-minute weather samples (one row per timestamp per session).
        columns:
          - name: season
            data_tests: [not_null]
          - name: round
            data_tests: [not_null]
      - name: telemetry
        description: >
          FastF1 distance-resampled car telemetry (one row per driver per lap per
          distance point).
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_code
            data_tests: [not_null]
      - name: positions
        description: >
          FastF1 time-stamped car positions on the shared session clock (one row
          per driver per position sample). Feeds the race-replay map.
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_code
            data_tests: [not_null]
      - name: race_control
        description: >
          FastF1 official race-control messages (flags, safety car, penalties,
          incidents, DRS) on the shared session clock. Feeds the replay message feed.
        columns:
          - name: season
            data_tests: [not_null]
          - name: session_time_sec
            data_tests: [not_null]
      - name: team_radio
        description: >
          OpenF1 team-radio clips (timestamped MP3 per driver) on the shared session
          clock. Audio only; partial coverage. Feeds the replay radio player.
        columns:
          - name: season
            data_tests: [not_null]
          - name: recording_url
            data_tests: [not_null]
      - name: openf1_positions
        description: Timestamped OpenF1 position-state changes aligned to the FastF1 session clock.
      - name: openf1_intervals
        description: Timestamped OpenF1 leader/ahead intervals aligned to the FastF1 session clock.
      - name: openf1_race_control
        description: Secondary OpenF1 race-control feed used only for boundary reconciliation.
      - name: openf1_timing_audit
        description: Per-race clock-alignment and source-coverage decision for OpenF1 timing.
      - name: ingestion_partitions
        description: >
          One audit row per raw partition replaced by ingestion. The load timestamp
          lets incremental marts refresh corrected historical races, not only append.
        columns:
          - name: resource
            data_tests: [not_null]
          - name: season
            data_tests: [not_null]
          - name: loaded_at
            data_tests: [not_null]
