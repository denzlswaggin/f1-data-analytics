version: 2

sources:
  - name: raw
    description: >
      Raw Ergast/Jolpica-F1 data landed by the ingestion layer, one table per
      resource. Loaded idempotently per season.
    schema: raw
    tables:
      - name: races
        description: Race schedule and circuit metadata, one row per race.
        columns:
          - name: season
            data_tests: [not_null]
          - name: round
            data_tests: [not_null]
      - name: results
        description: Race classification, one row per driver per race.
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_id
            data_tests: [not_null]
      - name: qualifying
        description: Qualifying classification, one row per driver per race.
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_id
            data_tests: [not_null]
      - name: laps
        description: FastF1 per-lap timing and tyre data (one row per driver per lap).
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_code
            data_tests: [not_null]
      - name: pitstops
        description: Ergast pit-stop timing (one row per driver per stop).
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_id
            data_tests: [not_null]
      - name: ergast_laps
        description: Ergast per-lap position and time (one row per driver per lap).
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_id
            data_tests: [not_null]
      - name: weather
        description: FastF1 per-minute weather samples (one row per timestamp per session).
        columns:
          - name: season
            data_tests: [not_null]
          - name: round
            data_tests: [not_null]
      - name: telemetry
        description: >
          FastF1 distance-resampled car telemetry (one row per driver per lap per
          distance point).
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_code
            data_tests: [not_null]
      - name: positions
        description: >
          FastF1 time-stamped car positions on the shared session clock (one row
          per driver per position sample). Feeds the race-replay map.
        columns:
          - name: season
            data_tests: [not_null]
          - name: driver_code
            data_tests: [not_null]
