version: 2

models:
  - name: stg_races
    description: One clean, typed row per race with a surrogate `race_key`.
    columns:
      - name: race_key
        description: Surrogate key = hash(season, round).
        data_tests: [unique, not_null]
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: race_date
        description: Calendar date of the race.

  - name: stg_results
    description: One typed row per driver per race (finishing classification).
    columns:
      - name: result_key
        description: Surrogate key = hash(season, round, driver_id).
        data_tests: [unique, not_null]
      - name: race_key
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_races')
              field: race_key
      - name: driver_id
        data_tests: [not_null]
      - name: is_classified
        data_tests:
          - accepted_values:
              values: [true, false]

  - name: stg_qualifying
    description: One typed row per driver per qualifying session; Q1/Q2/Q3 in seconds.
    columns:
      - name: qualifying_key
        description: Surrogate key = hash(season, round, driver_id).
        data_tests: [unique, not_null]
      - name: race_key
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_races')
              field: race_key
      - name: driver_id
        data_tests: [not_null]

  - name: stg_drivers
    description: Driver dimension (one row per driver) with display name and career span.
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
      - name: driver_name
        data_tests: [not_null]

  - name: stg_constructors
    description: Constructor dimension (one row per team) with active span.
    columns:
      - name: constructor_id
        data_tests: [unique, not_null]

  - name: stg_driver_codes
    description: >
      Season-grain bridge from the FastF1 3-letter driver_code to the Ergast
      driver_id, so telemetry models can join the driver dimension.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, driver_code]
    columns:
      - name: driver_code
        data_tests: [not_null]
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_drivers')
              field: driver_id

  - name: stg_laps
    description: One typed row per driver per lap (FastF1) with tyre/stint context.
    columns:
      - name: lap_key
        description: Surrogate key = hash(season, round, session, driver_code, lap_number).
        data_tests: [unique, not_null]
      - name: driver_code
        data_tests: [not_null]
      - name: lap_number
        data_tests: [not_null]

  - name: stg_pitstops
    description: One typed row per pit stop (Ergast); stop duration in seconds.
    columns:
      - name: pitstop_key
        description: Surrogate key = hash(season, round, driver_id, stop).
        data_tests: [unique, not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]

  - name: stg_ergast_laps
    description: One typed row per driver per lap (Ergast position + lap time).
    columns:
      - name: ergast_lap_key
        description: Surrogate key = hash(season, round, driver_id, lap).
        data_tests: [unique, not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: lap_number
        data_tests: [not_null]

  - name: stg_weather
    description: One typed row per weather sample (FastF1, ~per minute).
    columns:
      - name: weather_key
        description: Surrogate key = hash(season, round, session, time_sec).
        data_tests: [unique, not_null]
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]

  - name: stg_telemetry
    description: One typed row per driver per lap per distance point (FastF1 telemetry).
    columns:
      - name: telemetry_key
        description: >
          Surrogate key = hash(season, round, session, driver_code, lap_number,
          distance_m).
        data_tests: [unique, not_null]
      - name: driver_code
        data_tests: [not_null]
      - name: distance_m
        data_tests: [not_null]

  - name: stg_positions
    description: >
      One typed row per driver per position sample (FastF1), on the shared session
      clock — the basis for the race-replay track map.
    columns:
      - name: position_key
        description: Surrogate key = hash(season, round, session, driver_code, session_time_sec).
        data_tests: [unique, not_null]
      - name: driver_code
        data_tests: [not_null]
      - name: session_time_sec
        data_tests: [not_null]
