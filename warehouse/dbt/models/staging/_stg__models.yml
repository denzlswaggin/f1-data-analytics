version: 2

models:
  - name: stg_races
    description: One clean, typed row per race with a surrogate `race_key`.
    columns:
      - name: race_key
        description: Surrogate key = hash(season, round).
        data_tests: [unique, not_null]
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: race_date
        description: Calendar date of the race.

  - name: stg_results
    description: One typed row per driver per race (finishing classification).
    columns:
      - name: result_key
        description: Surrogate key = hash(season, round, driver_id).
        data_tests: [unique, not_null]
      - name: race_key
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_races')
              field: race_key
      - name: driver_id
        data_tests: [not_null]
      - name: is_classified
        description: >-
          Source classification from position_text, independently of finishing status.
          A matching positive numeric position is classified; R/D/W/F is not.
          Missing, unrecognised or conflicting position evidence remains null.
        data_tests:
          - accepted_values:
              values: [true, false]

  - name: stg_qualifying
    description: One typed row per driver per qualifying session; Q1/Q2/Q3 in seconds.
    columns:
      - name: qualifying_key
        description: Surrogate key = hash(season, round, driver_id).
        data_tests: [unique, not_null]
      - name: race_key
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_races')
              field: race_key
      - name: driver_id
        data_tests: [not_null]

  - name: stg_drivers
    description: Driver dimension (one row per driver) with display name and career span.
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
      - name: driver_name
        data_tests: [not_null]

  - name: stg_constructors
    description: Constructor dimension (one row per team) with active span.
    columns:
      - name: constructor_id
        data_tests: [unique, not_null]

  - name: stg_driver_codes
    description: >
      Season-grain bridge from the FastF1 3-letter driver_code to the Ergast
      driver_id, so telemetry models can join the driver dimension.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, driver_code]
    columns:
      - name: driver_code
        data_tests: [not_null]
      - name: driver_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_drivers')
              field: driver_id

  - name: stg_laps
    description: One typed row per driver per lap (FastF1) with tyre/stint context.
    columns:
      - name: lap_key
        description: Surrogate key = hash(season, round, session, driver_code, lap_number).
        data_tests: [unique, not_null]
      - name: driver_code
        data_tests: [not_null]
      - name: lap_number
        data_tests: [not_null]

  - name: stg_pitstops
    description: One typed row per pit stop (Ergast); stop duration in seconds.
    columns:
      - name: pitstop_key
        description: Surrogate key = hash(season, round, driver_id, stop).
        data_tests: [unique, not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]

  - name: stg_ergast_laps
    description: One typed row per driver per lap (Ergast position + lap time).
    columns:
      - name: ergast_lap_key
        description: Surrogate key = hash(season, round, driver_id, lap).
        data_tests: [unique, not_null]
      - name: driver_id
        data_tests: [not_null]
      - name: lap_number
        data_tests: [not_null]

  - name: stg_weather
    description: One typed row per weather sample (FastF1, ~per minute).
    columns:
      - name: weather_key
        description: Surrogate key = hash(season, round, session, time_sec).
        data_tests: [unique, not_null]
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]

  - name: stg_telemetry
    description: One typed row per driver per lap per distance point (FastF1 telemetry).
    columns:
      - name: telemetry_key
        description: >
          Surrogate key = hash(season, round, session, driver_code, lap_number,
          distance_m).
        data_tests: [unique, not_null]
      - name: driver_code
        data_tests: [not_null]
      - name: distance_m
        data_tests: [not_null]

  - name: stg_positions
    description: >
      One typed row per driver per position sample (FastF1), on the shared session
      clock — the basis for the race-replay track map.
    data_tests:
      # (0,0) is FastF1's "no signal / in garage" sentinel (cleaned at ingest). Real
      # on-track coords are offset, never exactly origin — so any (0,0) is bad data.
      - dbt_utils.expression_is_true:
          expression: "x != 0 or y != 0"
    columns:
      - name: position_key
        description: Surrogate key = hash(season, round, session, driver_code, session_time_sec).
        data_tests: [unique, not_null]
      - name: driver_code
        data_tests: [not_null]
      - name: session_time_sec
        data_tests: [not_null]

  - name: stg_race_control
    description: >
      One typed row per official race-control message (FastF1) on the shared session
      clock — flags, safety car, penalties, incidents, DRS. Feeds the replay feed.
    columns:
      - name: message_key
        description: Surrogate key = hash(season, round, session, session_time_sec, message).
        data_tests: [unique, not_null]
      - name: session_time_sec
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]

  - name: stg_team_radio
    description: >
      One typed row per team-radio clip (OpenF1) on the shared session clock — audio
      only (recording_url), partial coverage. Feeds the replay radio player.
    columns:
      - name: radio_key
        description: Surrogate key = hash(season, round, session, recording_url).
        data_tests: [unique, not_null]
      - name: recording_url
        data_tests: [not_null]

  - name: stg_openf1_positions
    description: OpenF1 position-state changes aligned to the FastF1 session clock.
    columns:
      - name: openf1_position_key
        data_tests: [unique, not_null]
      - name: driver_code
        data_tests: [not_null]
      - name: position
        data_tests: [not_null]

  - name: stg_openf1_intervals
    description: OpenF1 leader and ahead gaps aligned to the FastF1 session clock.
    columns:
      - name: openf1_interval_key
        data_tests: [unique, not_null]
      - name: driver_code
        data_tests: [not_null]

  - name: stg_openf1_race_control
    description: Secondary OpenF1 race-control messages for intervention reconciliation.
    columns:
      - name: openf1_control_key
        data_tests: [unique, not_null]

  - name: stg_openf1_timing_audit
    description: Per-race OpenF1 clock-alignment, coverage and admission decision.
    columns:
      - name: season
        data_tests: [not_null]
      - name: round
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['verified', 'rejected', 'unavailable']
      - name: anchor_source
        description: Local lap partition used to align OpenF1 UTC timestamps.
        data_tests:
          - accepted_values:
              arguments:
                values: ['raw.laps', 'staging.stg_laps', 'unavailable']
