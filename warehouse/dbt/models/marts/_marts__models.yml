version: 2

models:
  - name: mart_driver_season_pace
    description: >
      Per-driver, per-season teammate qualifying summary: head-to-head record and
      mean pace gap (negative = faster than teammate).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [driver_id, season]
    columns:
      - name: driver_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: races_compared
        data_tests: [not_null]
      - name: teammate_win_pct
        description: Share of compared races the driver out-qualified their teammate.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100

  - name: mart_lap_times
    description: >
      Green-flag race laps with tyre context (one row per driver per racing lap),
      for race-pace and tyre-stint analysis. FastF1-sourced within the 2024-2026 data context.
    columns:
      - name: lap_time_sec
        description: Lap time in seconds (valid timed green-flag laps only).
        data_tests: [not_null]
      - name: driver_code
        data_tests: [not_null]
      - name: driver_id
        description: >
          Ergast driver_id bridged from the FastF1 driver_code via
          stg_driver_codes (may be null if a lap has no matching Ergast entry).
        data_tests:
          # Tolerant (warn, not error): telemetry could in principle carry a code
          # with no Ergast result row; nulls are ignored by the relationships test.
          - relationships:
              to: ref('stg_drivers')
              field: driver_id
              config:
                severity: warn
      - name: compound
        data_tests:
          - accepted_values:
              values: ["SOFT", "MEDIUM", "HARD", "INTERMEDIATE", "WET", "HYPERSOFT",
                       "ULTRASOFT", "SUPERSOFT", "SUPERHARD", "UNKNOWN", "TEST_UNKNOWN"]

  - name: mart_tyre_degradation
    description: >
      Tyre-degradation rate (sec/lap) per race and compound, from a linear fit of
      lap time vs tyre age over green-flag laps.
    # Enforced data contract: dbt fails the build if the model's shape drifts from
    # the columns/types declared below. Types are cross-dialect (DuckDB + Postgres).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, round, compound]
    columns:
      - name: season
        data_type: integer
        data_tests: [not_null]
      - name: round
        data_type: integer
        data_tests: [not_null]
      - name: race_name
        data_type: varchar
      - name: compound
        data_type: varchar
      - name: n_laps
        data_type: bigint
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 8
              max_value: 2000
      - name: deg_sec_per_lap
        data_type: double precision
        description: Slope of lap time vs tyre life; higher = faster fall-off.
        data_tests: [not_null]
      - name: best_lap_sec
        data_type: double precision
      - name: avg_lap_sec
        data_type: double precision

  - name: mart_pit_strategy
    description: >
      Undercut/overcut outcome per pit stop: track-position change across the
      stop window (lap before vs two laps after) plus stop duration. Pit-stop
      timing comes from Jolpica and positions from the loaded FastF1 race laps.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, round, driver_id, stop_number]
    columns:
      - name: driver_id
        data_tests: [not_null]
      - name: stop_number
        data_tests: [not_null]
      - name: positions_gained
        description: Places gained across the stop cycle (position_before - position_after).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -20
              max_value: 20

  - name: mart_weather_degradation
    description: >
      Tyre degradation (sec/lap) per race, compound and lap-aligned
      weather bucket (wet/hot/cool). FastF1-sourced within the 2024-2026 data context.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, round, compound, weather_bucket]
    columns:
      - name: deg_sec_per_lap
        description: Slope of lap time vs tyre life; higher = faster fall-off.
      - name: weather_bucket
        description: Conditions observed within each lap (null when no weather sample aligns).
        data_tests:
          - accepted_values:
              values: ["wet", "hot", "cool"]
      - name: n_laps
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 8
              max_value: 2000

  - name: mart_speed_trap
    description: >
      Straight-line speed (km/h) per driver per race from the SpeedST trap over
      green-flag laps — a power-unit / low-drag proxy. FastF1-sourced within the 2024-2026 data context.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, round, driver_code]
    columns:
      - name: driver_code
        data_tests: [not_null]
      - name: top_speed_kph
        description: Fastest straight-line speed-trap reading in the race (km/h).
        data_tests:
          # Scope the sanity range to drivers with a real green-flag sample — a
          # driver who retired after one lap can legitimately top out much lower.
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 200
              max_value: 380
              row_condition: "n_laps >= 3"

  - name: mart_lap_telemetry
    description: >
      Race-lap telemetry (speed/throttle/brake/DRS/gear/x/y) resampled by distance,
      with driver and tyre context. Powers speed traces and track maps.
      FastF1-sourced within the 2024-2026 data context.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, round, driver_code, lap_number, distance_m]
    columns:
      - name: driver_code
        data_tests: [not_null]
      - name: distance_m
        data_tests: [not_null]
      - name: speed_kph
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 400
      - name: source_loaded_at
        description: Raw telemetry partition version materialised into this race.
        data_tests: [not_null]

  - name: mart_stint_degradation
    description: >
      Per-driver-stint tyre-degradation rate (sec/lap): a linear fit of lap time
      vs tyre age within each individual stint. Finer-grained than
      mart_tyre_degradation, which pools by race and compound. FastF1-sourced within the 2024-2026 data context.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, round, driver_code, stint]
    columns:
      - name: deg_sec_per_lap
        description: Slope of lap time vs tyre life within the stint; higher = faster fall-off.
        data_tests: [not_null]
      - name: driver_id
        description: Ergast driver_id bridged from driver_code (may be null if unmatched).
        data_tests:
          - relationships:
              to: ref('stg_drivers')
              field: driver_id
              config:
                severity: warn

  - name: mart_adjusted_stint_degradation
    description: >
      Per-driver-stint tyre fall-off after subtracting a leave-one-out peer mean
      on the same race lap and compound. This controls shared fuel burn, track
      evolution, and compound choice before fitting residual pace versus tyre age.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, round, driver_code, stint]
    columns:
      - name: adjusted_deg_sec_per_lap
        description: Residual pace slope versus tyre age; higher means faster fall-off.
        data_tests: [not_null]
      - name: comparable_laps
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 5
              strictly: false
      - name: cliff_signal
        description: True when the final three comparable laps lose at least 0.8 s to the first three.
        data_tests:
          - accepted_values:
              values: [true, false]

  - name: mart_stint_strategy
    description: >
      Per-driver tyre-stint sequence for a race — one row per (season, round,
      driver, stint) with the compound run and the absolute lap span it covered.
      Powers the tyre-strategy gantt (a per-driver bar of compound-coloured stints
      with pit stops at the boundaries). Built from every race lap (not just
      green-flag), so spans are contiguous. FastF1-sourced within the 2024-2026 data context.
    # Enforced data contract: dbt fails the build if the model's shape drifts from
    # the columns/types declared below. Types are cross-dialect (DuckDB + Postgres).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, round, driver_code, stint]
    columns:
      - name: season
        data_type: integer
        data_tests: [not_null]
      - name: round
        data_type: integer
        data_tests: [not_null]
      - name: race_name
        data_type: varchar
      - name: driver_code
        data_type: varchar
        data_tests: [not_null]
      - name: driver_id
        data_type: varchar
        description: Ergast driver_id bridged from driver_code (may be null if unmatched).
        data_tests:
          - relationships:
              to: ref('stg_drivers')
              field: driver_id
              config:
                severity: warn
      - name: driver_name
        data_type: varchar
      - name: team
        data_type: varchar
      - name: stint
        data_type: integer
        description: 1-based stint index within the race (increments at each pit stop).
        data_tests: [not_null]
      - name: compound
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              values: ["SOFT", "MEDIUM", "HARD", "INTERMEDIATE", "WET", "HYPERSOFT",
                       "ULTRASOFT", "SUPERSOFT", "SUPERHARD", "UNKNOWN", "TEST_UNKNOWN"]
      - name: start_lap
        data_type: integer
        description: First lap number of the stint.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 200
      - name: end_lap
        data_type: integer
        description: Last lap number of the stint.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 200
      - name: stint_laps
        data_type: integer
        description: Lap span of the stint (end_lap - start_lap + 1).
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 200
      - name: tyre_life_end
        data_type: integer
        description: Tyre age (laps) at the end of the stint.
      - name: started_fresh
        data_type: boolean
        description: Whether the set fitted for this stint was a fresh (new) tyre.
      - name: finish_position
        data_type: integer
        description: Driver's position on their final lap — used to order the gantt rows.
      - name: deg_sec_per_lap
        data_type: double precision
        description: >
          Tyre pace fall-off within the stint (sec/lap), reused from
          mart_stint_degradation. Null for stints with too few green laps to fit a
          slope. Drives the degradation shading on the gantt.

  - name: mart_race_story
    description: >
      Compatibility table of recorded race results and recorded pit visits.
      Retired pace and execution fields are deliberately null; corrected peer
      pace is supplied by the separate dashboard analysis. Keeping these fields
      empty prevents a dbt rebuild from restoring the old pit-contaminated model.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [season, round, driver_code]
    columns:
      - name: driver_code
        data_tests: [not_null]
      - name: pace_samples
        data_tests:
          - accepted_values:
              values: [0]
              quote: false
      - name: methodology_version
        data_tests:
          - not_null
          - accepted_values:
              values: [recorded-results-v1]
      - name: story_label
        data_tests:
          - not_null
          - accepted_values:
              values: ['Recorded result; pace supplied by separate analysis']
