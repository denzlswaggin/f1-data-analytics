version: 2

seeds:
  - name: constructor_colors
    description: >
      Constructor -> hex livery colour, keyed on the FastF1 team name (as it lands
      in raw.laps). Drives car colours in the race-replay track map. Includes a few
      teams needed by the 2024-2026 replay context.
    columns:
      - name: team
        description: FastF1 team name (e.g. "Red Bull Racing").
        data_tests: [unique, not_null]
      - name: team_color
        description: Hex colour string (e.g. "#3671C6").
        data_tests: [not_null]
